{% extends "base.html" %}
{% block title %}Modifier {{ membre.full_name }}{% endblock %}
{% block content %}

<p><a href="{{ url_for('member_detail', member_id=membre.id) }}">← Retour à la fiche</a></p>

<h2>Modifier {{ membre.full_name }}</h2>

<div class="card">
  <form method="POST" action="{{ url_for('edit_member', member_id=membre.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label>Prénom</label><input type="text" name="prenom" value="{{ membre.prenom }}" required></div>
    <div class="form-group"><label>Nom</label><input type="text" name="nom" value="{{ membre.nom }}" required></div>
    <div class="form-group"><label>Numéro WhatsApp</label><input type="text" name="whatsapp" value="{{ membre.whatsapp }}" required></div>
    <div class="form-group"><label>Email (optionnel)</label><input type="email" name="email" value="{{ membre.email or '' }}"></div>
    <button type="submit" class="btn">Enregistrer les modifications</button>
  </form>
</div>

{% endblock %}
